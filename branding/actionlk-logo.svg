<svg width="440" height="120" viewBox="0 0 440 120" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .alk-wordmark { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    </style>
  </defs>

  <!-- terminal window -->
  <rect x="4" y="4" width="432" height="112" rx="10" fill="#0d150f" stroke="#1f7a3d" stroke-width="1.5"/>

  <!-- title bar -->
  <path d="M4 14 a10 10 0 0 1 10 -10 h412 a10 10 0 0 1 10 10 v16 h-432 z" fill="#101c14"/>
  <line x1="4" y1="30" x2="436" y2="30" stroke="#163D24" stroke-width="1"/>

  <!-- traffic-light dots -->
  <circle cx="22" cy="14" r="5" fill="#FF4D4D"/>
  <circle cx="40" cy="14" r="5" fill="#2a4a33"/>
  <circle cx="58" cy="14" r="5" fill="#39FF6A"/>

  <!-- prompt + wordmark -->
  <text x="30" y="80" class="alk-wordmark" font-size="42" font-weight="700" fill="#39FF6A">&gt;</text>
  <text x="62" y="78" class="alk-wordmark" font-size="36" font-weight="700" fill="#D7FFE0" letter-spacing="0.5">Action<tspan fill="#39FF6A">LK</tspan></text>

  <!-- blinking cursor block -->
  <rect x="258" y="52" width="14" height="30" fill="#39FF6A"/>

  <!-- tagline -->
  <text x="31" y="100" class="alk-wordmark" font-size="12" fill="#5C8A6B" letter-spacing="0.5">breach investigation ctf</text>
</svg>
